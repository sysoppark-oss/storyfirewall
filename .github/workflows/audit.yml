name: Dependency advisories (cargo audit)

# 의존성 보안 권고 점검. RustSec 권고 DB 와 저장소의 모든 Cargo.lock(작업공간, 화면, PoC)을 대조한다.
# 초록은 '알려진 취약점 없음'이지 '경고 없음'이 아니다 — unsound 경고(지금: board 의 ratatui 가 끌어오는 lru)는 실행 기록에서 본다.
# - 취약점(vulnerability)이 있으면 실패. unmaintained / unsound 는 경고로만 남긴다(cargo audit 기본 동작).
# - 권고는 우리가 코드를 올리지 않아도 새로 나오므로 날마다 한 번 돈다.
# - 개발 빌드(devbuild)와 별개 작업이라, 여기서 실패해도 노트북 설치 순환은 막지 않는다.
# cargo-audit: MIT OR Apache-2.0 (rustsec/rustsec). 빌드 때만 쓰는 점검 도구이며 배포물에 들어가지 않는다.
on:
  push:
    paths:
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # 매일 21:17 UTC (한국 06:17). 정각을 피한다.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 도구 판을 고정한다(점검 도구가 저절로 바뀌어 결과가 달라지지 않게). 올릴 때는 이 줄과 캐시 키를 함께 바꾼다.
      - uses: actions/cache@v4
        id: tool
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}
      - name: Install cargo-audit 0.23.0
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit every tracked Cargo.lock
        # 잠금 파일을 이름으로 적지 않고 저장소에서 찾는다(새로 생겨도 저절로 포함). 하나가 실패해도 나머지를 끝까지 보고 마지막에 실패한다.
        run: |
          rc=0
          for f in $(git ls-files 'Cargo.lock' '**/Cargo.lock'); do
            echo "::group::$f"
            cargo audit --file "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc
