# Azure Pipelines (비용 0): Windows 에서 워크스페이스 빌드·단위 시험 + UI 단위 시험.
# Linux 에서는 못 보는 Windows 전용 코드(수집기 ETW·WFP·서비스)의 실제 컴파일을 확인한다. ETW·WFP 실행 시험(poc3·poc2·poc4)은 2단계에서 옮긴다.
# 연결: 2026-11-03 Azure DevOps sysoppark/story-firewall (GitHub 앱, 비밀 변수 GH_PUSH_TOKEN)
trigger:
  branches:
    include: [main]
  paths:
    include: [crates/*, ui/*, third_party/*, poc/*, Cargo.toml, Cargo.lock, .azure/win-tests.yml, .azure/poc-jobs.yml, .azure/poc-plan.ps1]
pr: none

# 주 1회(일 03:41 KST) PoC 실행 시험 전부 — 바뀐 것이 없어도 돈다(Windows 업데이트로 깨지는 것 확인)
schedules:
  - cron: "41 18 * * 6"
    displayName: weekly poc-all
    branches:
      include: [main]
    always: true

# 실행 위치: laptop = 노트북 자체 실행기(Azure 무료 1대·무제한, 카드 불필요, 빌드·단위 시험만)
#           hosted = Microsoft 호스팅(무료 월 1,800분 — Azure 구독 연결 필요, 설치 시험까지)
parameters:
  - name: agent
    type: string
    # 2026-11-03 확인: 조직에 Microsoft 호스팅 무료 1개·월 1,800분이 열려 있다(지출 한도 걸린 구독 연결) → 기본 = hosted
    default: hosted
    values: [laptop, hosted]

jobs:
  - job: test
    # 최상위 pool 에는 조건식을 못 쓴다(Azure 오류 "template expression is not allowed") → job 아래에 둔다
    pool:
      ${{ if eq(parameters.agent, 'hosted') }}:
        vmImage: windows-2022
      ${{ else }}:
        name: laptop
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 1
      # NodeTool@0 은 지원 종료 예정(Azure 경고) → UseNode@1
      - task: UseNode@1
        inputs:
          versionSource: spec
          version: "22.x"
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            # laptop agent account has no Rust yet: official rustup-init (static.rust-lang.org), per-user install
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo test --locked --workspace 2>&1 | Tee-Object -FilePath win-tests.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
        displayName: cargo test (Windows)
      - pwsh: |
          npm ci
          npx vitest run
        workingDirectory: ui
        displayName: UI unit tests
      - pwsh: pwsh -NoProfile -File .azure/push-log.ps1 -Name win-tests -Files win-tests.log
        displayName: Push logs to GitHub ci-logs
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  # 실데이터 규모 성능(CLAUDE.md: 화면 조회 2초 이내). 수동·주간 실행 또는 커밋 메시지 [perf] 에서만(무료 분 절약)
  - job: perf
    condition: or(in(variables['Build.Reason'], 'Manual', 'Schedule'), contains(variables['Build.SourceVersionMessage'], '[perf]'))
    pool:
      vmImage: windows-2022
    timeoutInMinutes: 90
    steps:
      - checkout: self
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          $fail = 0
          # 100만 건은 Windows 호스팅에서 넣기만 43분(27차 perf run-47) — 수동 실행·[perf-1m] 에서만. 주간은 30만
          $sizes = @(300000)
          if ($env:BUILD_REASON -eq "Manual" -or $env:COMMIT_MSG -like "*[[]perf-1m[]]*") { $sizes += 1000000 }
          foreach ($n in $sizes) {
            $env:SF_PERF_N = "$n"
            cargo test --release --locked -p svc --test perf_scale -- --nocapture 2>&1 | Tee-Object -FilePath "perf-$n.log"
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          Select-String -Path perf-*.log -Pattern "PERF" | ForEach-Object { $_.Line } | Tee-Object -FilePath perf-summary.log
          exit $fail
        displayName: perf_scale 300k (1M manual) (release)
        env:
          COMMIT_MSG: $(Build.SourceVersionMessage)
      - pwsh: pwsh -NoProfile -File .azure/push-log.ps1 -Name perf -Files perf-summary.log,perf-300000.log,perf-1000000.log
        displayName: Push logs to GitHub ci-logs
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  # DB-IP Lite 월간 갱신(전: GitHub Actions geo-data.yml — 결제 제한으로 멈춤). 새 파이프라인 정의 없이 주간 실행에 붙인다:
  # 매월 첫 토요일 주간 실행(1~7일)·수동 실행·커밋 메시지 [geo] 에서만. 받은 DB 는 알려진 주소로 검증한 뒤 geo-data 브랜치에 강제 푸시
  - job: geo
    condition: or(eq(variables['Build.Reason'], 'Manual'), and(eq(variables['Build.Reason'], 'Schedule'), le(format('{0:dd}', pipeline.startTime), '07')), contains(variables['Build.SourceVersionMessage'], '[geo]'))
    pool:
      vmImage: ubuntu-24.04
    timeoutInMinutes: 15
    steps:
      - checkout: none
      - bash: |
          set -e
          mkdir -p out
          for kind in country asn; do
            ok=""
            for m in "$(date -u +%Y-%m)" "$(date -u -d "$(date -u +%Y-%m-15) -1 month" +%Y-%m)"; do
              url="https://download.db-ip.com/free/dbip-${kind}-lite-${m}.mmdb.gz"
              if curl -fsSL -o "out/${kind}.gz" "$url"; then ok="$m"; break; fi
            done
            [ -n "$ok" ] || { echo "no $kind db"; exit 1; }
            gunzip -c "out/${kind}.gz" > "out/dbip-${kind}-lite.mmdb"
            rm "out/${kind}.gz"
            echo "${kind}_month=$ok" >> out/manifest.txt
          done
          ls -la out
        displayName: Download DB-IP Lite (this month, else last month)
      - bash: |
          set -e
          python3 -m pip install --quiet --break-system-packages maxminddb==2.6.2 || python3 -m pip install --quiet maxminddb==2.6.2
          python3 - <<'PY'
          import maxminddb
          c = maxminddb.open_database("out/dbip-country-lite.mmdb")
          a = maxminddb.open_database("out/dbip-asn-lite.mmdb")
          kr = c.get("168.126.63.1")["country"]["iso_code"]
          g = a.get("8.8.8.8")
          print("168.126.63.1 ->", kr, " 8.8.8.8 ->", g)
          assert kr == "KR", kr
          assert g["autonomous_system_number"] == 15169, g
          PY
        displayName: Check known addresses
      - bash: |
          set -e
          cd out
          for f in dbip-country-lite.mmdb dbip-asn-lite.mmdb; do echo "$f sha256=$(sha256sum $f | cut -d' ' -f1)" >> manifest.txt; done
          echo "source=DB-IP.com IP to Country Lite / IP to ASN Lite, CC BY 4.0, https://db-ip.com" >> manifest.txt
          cat manifest.txt
          git init -q
          git checkout -q --orphan geo-data
          git add -A
          git -c user.name=geo-data -c user.email=geo-data@users.noreply.github.com commit -q -m "geo data $(date -u +%Y-%m-%d) (azure)"
          git push -q -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/sysoppark-oss/story-firewall.git" geo-data
        displayName: Publish to geo-data branch
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  # 2단계(2026-11-03): ETW·WFP·서비스·UI·설치 실행 시험. 커밋 메시지 [poc]·[poc-all]·[poc4] 등이나 수동·주간 실행에서만 돈다
  - template: poc-jobs.yml
