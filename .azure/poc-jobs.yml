# 자동 생성: python3 .azure/gen-poc-jobs.py (원본: .github/workflows/*-windows.yml). 손으로 고치지 말 것.
# win-tests 파이프라인 안의 PoC 실행 시험 job 들. plan job 이 바뀐 경로로 돌릴 job 을 고른다(무료 월 1,800분 절약).
jobs:
  - job: plan
    displayName: 바뀐 경로로 돌릴 PoC job 고르기
    # 태그가 없는 보통 커밋에서는 이 job 도 돌지 않는다(VM 1분 절약) → 뒤 job 들도 건너뜀
    condition: or(in(variables['Build.Reason'], 'Manual', 'Schedule'), contains(variables['Build.SourceVersionMessage'], '[poc'), contains(variables['Build.SourceVersionMessage'], '[a28]'), contains(variables['Build.SourceVersionMessage'], '[devhost]'))
    pool:
      vmImage: windows-2025
    steps:
      - checkout: self
        fetchDepth: 2
      - pwsh: |
          $rules = @'
          poc2=crates/policy/**,Cargo.toml,Cargo.lock,.azure/poc-jobs.yml
          poc3=crates/graph/**,crates/story/**,crates/collector/**,Cargo.toml,third_party/**,Cargo.lock,.azure/poc-jobs.yml
          poc4=crates/svc/**,crates/api/**,crates/engine/**,Cargo.toml,Cargo.lock,.azure/poc-jobs.yml
          poc5=ui/**,crates/svc/**,.azure/poc-jobs.yml
          a28=ui/src-tauri/tauri.installer.conf.json,ui/src-tauri/installer-hooks.nsh,ui/src-tauri/src/**,crates/svc/**,.azure/poc-jobs.yml
          devhost=poc/devhost/**,poc/b2/**,.azure/poc-jobs.yml
          '@
          pwsh -NoProfile -File .azure/poc-plan.ps1 -Rules $rules
        name: p
        displayName: plan
        env:
          COMMIT_MSG: $(Build.SourceVersionMessage)
  - job: poc2
    displayName: poc2 (poc2-wfp-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.poc2'], 'true'))
    timeoutInMinutes: 40
    pool:
      vmImage: windows-2025
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo --version
        displayName: Rust toolchain
      - pwsh: |
          cargo build --release --locked -p policy --bin policy-poc 2>&1 | Tee-Object -FilePath build.log
        displayName: Build policy-poc
      - pwsh: |
          $exe = ".\target\release\policy-poc.exe"
          $curl = "$env:SystemRoot\System32\curl.exe"
          $log = "run.out"
          function Log($s) { $s | Tee-Object -FilePath $log -Append }
          function CurlCode() { & $curl -s -m 8 --output NUL https://www.rust-lang.org/; return $LASTEXITCODE }

          Log "=== 0. baseline curl ==="
          Log ("curl exit (expect 0): " + (CurlCode))

          Log "=== 7. guard ==="
          & $exe guardtest 2>&1 | Tee-Object -FilePath $log -Append

          Log "=== 1. block curl.exe outbound (transaction) ==="
          & $exe block $curl ids.json 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Milliseconds 500

          Log "=== 2. curl must fail ==="
          $c = CurlCode; Log "curl exit (expect !=0, 7/28/35): $c"

          Log "=== 3. persistence proxy: new process lists our filters ==="
          & $exe list 2>&1 | Tee-Object -FilePath $log -Append

          Log "=== 4. watch 20s: external delete -> self-heal, drops ==="
          $w = Start-Process -FilePath $exe -ArgumentList "watch","20","ids.json" -RedirectStandardOutput watch.out -RedirectStandardError watch.err -PassThru
          Start-Sleep -Seconds 3
          # 차단 이벤트 만들기
          $c = CurlCode; Log "curl during watch exit: $c"
          Start-Sleep -Seconds 2
          # 공격자 역할: 필터 하나 삭제
          $ids = (Get-Content ids.json | ConvertFrom-Json).PSObject.Properties.Name
          Log ("deleting filter " + $ids[0])
          & $exe delete $ids[0] 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 3
          # 재등록 뒤에도 막히는지
          $c = CurlCode; Log "curl after tamper+heal exit (expect !=0): $c"
          Wait-Process -Id $w.Id -Timeout 40 -ErrorAction SilentlyContinue
          Log "--- watch.out ---"; Get-Content watch.out | Tee-Object -FilePath $log -Append
          Log "--- watch.err ---"; Get-Content watch.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append

          Log "=== 5. unblock -> curl ok ==="
          & $exe unblock ids.json 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Milliseconds 500
          $c = CurlCode; Log "curl exit after unblock (expect 0): $c"

          Log "=== R. reauth test: block during an in-flight download ==="
          $dl = Start-Process -FilePath $curl -ArgumentList '-sL','--limit-rate','1M','--output','NUL','-w','"dl_bytes=%{size_download} exit_time=%{time_total}"','"https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/PortableGit-2.47.1-64-bit.7z.exe"' -RedirectStandardOutput reauth.txt -PassThru
          Start-Sleep -Seconds 4
          & $exe block $curl ids2.json 2>&1 | Tee-Object -FilePath $log -Append
          $t0 = Get-Date
          Wait-Process -Id $dl.Id -Timeout 25 -ErrorAction SilentlyContinue
          $alive = -not $dl.HasExited
          if ($alive) { Stop-Process -Id $dl.Id -Force }
          Log ("download still alive after 25s: " + $alive + " ; waited " + ((Get-Date) - $t0).TotalSeconds + "s ; curl exit=" + $dl.ExitCode)
          Log ("reauth: " + (Get-Content reauth.txt -ErrorAction SilentlyContinue))
          & $exe unblock ids2.json 2>&1 | Tee-Object -FilePath $log -Append

          Log "=== 8. replace: old version -> new version in one transaction (11th review Q1) ==="
          & $exe block $curl ids3.json 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Milliseconds 300
          & $exe replace ids3.json $curl ids4.json fail 2>&1 | Tee-Object -FilePath $log -Append
          $c = CurlCode; Log "curl after failed replace (expect !=0, old filters kept): $c"
          & $exe replace ids3.json $curl ids4.json 2>&1 | Tee-Object -FilePath $log -Append
          $c = CurlCode; Log "curl after replace (expect !=0, new filters): $c"
          & $exe unblock ids4.json 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Milliseconds 300
          $c = CurlCode; Log "curl after unblock new (expect 0): $c"

          Log "=== B. BFE restart: do persistent filter ids survive? (28th review Q2, Gemini claim unverified) ==="
          & $exe block $curl ids5.json 2>&1 | Tee-Object -FilePath $log -Append
          $before = (Get-Content ids5.json | ConvertFrom-Json).PSObject.Properties.Name | Sort-Object
          $deps = Get-Service BFE -DependentServices | Where-Object Status -eq Running
          # run-76: Restart-Service failed ("Cannot open 'BFE' service") and the ids matched only because BFE never
          # restarted. Record the hosting PID before/after so the result is labeled real or inconclusive.
          $bfePid0 = (Get-CimInstance Win32_Service -Filter "Name='BFE'").ProcessId
          Restart-Service BFE -Force -ErrorAction Continue 2>&1 | Tee-Object -FilePath $log -Append
          foreach ($d in $deps) { Start-Service $d.Name -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          $listed = & $exe list 2>&1
          $listed | Tee-Object -FilePath $log -Append
          $after = $listed | Where-Object { $_ -match '^\s+(\d+) ' } | ForEach-Object { ($_ -split '\s+')[1] } | Sort-Object
          Log ("bfe ids before: " + ($before -join ","))
          Log ("bfe ids after : " + ($after -join ","))
          Log ("bfe ids same: " + ((Compare-Object $before $after) -eq $null))
          $c = CurlCode; Log "curl after BFE restart (expect !=0, persistent): $c"
          $bfePid1 = (Get-CimInstance Win32_Service -Filter "Name='BFE'").ProcessId
          if ($bfePid1 -ne $bfePid0) { Log "BFE_RESTART: done pid $bfePid0 -> $bfePid1" } else { Log "BFE_RESTART: not_done pid $bfePid0 (result inconclusive, ids not compared across a restart)" }
          & $exe cleanup 2>&1 | Tee-Object -FilePath $log -Append

          Log "=== 6. cleanup ==="
          & $exe cleanup 2>&1 | Tee-Object -FilePath $log -Append
          & $exe list 2>&1 | Tee-Object -FilePath $log -Append
          $c = CurlCode; Log "final curl exit (expect 0): $c"
          Log "END"
        displayName: Scenario
      - pwsh: |
          if (Test-Path .\target\release\policy-poc.exe) { & .\target\release\policy-poc.exe cleanup }
          & "$env:SystemRoot\System32\curl.exe" -s -m 8 --output NUL https://www.rust-lang.org/; "post-cleanup curl exit: $LASTEXITCODE"
        displayName: Safety cleanup
        condition: always()
      - pwsh: |
          $log = Get-Content run.out -Raw -ErrorAction SilentlyContinue
          $expect = @(
            'curl exit \(expect 0\): 0'
            'curl exit \(expect !=0, 7/28/35\): (7|28|35)'
            'curl after tamper\+heal exit \(expect !=0\): [1-9]'
            'curl exit after unblock \(expect 0\): 0'
            'curl after failed replace \(expect !=0, old filters kept\): [1-9]'
            'curl after replace \(expect !=0, new filters\): [1-9]'
            'curl after unblock new \(expect 0\): 0'
            'curl after BFE restart \(expect !=0, persistent\): [1-9]'
          )
          $bad = 0
          foreach ($p in $expect) {
            if ($log -match $p) { "PASS  $p" } else { "FAIL  $p"; $bad++ }
          }
          "assert: $bad failed of $($expect.Count)" | Tee-Object -FilePath assert.txt
          if ($bad -gt 0) { exit 1 }
        displayName: Assert expected outcomes
        condition: always()
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item assert.txt, build.log, run.out, watch.out, watch.err, reauth.txt, ids.json $run -ErrorAction SilentlyContinue
          pwsh -NoProfile -File .azure/push-log.ps1 -Name poc2 -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  - job: poc3
    displayName: poc3 (poc3-collector-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.poc3'], 'true'))
    timeoutInMinutes: 50
    pool:
      vmImage: windows-2025
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo --version
        displayName: Rust toolchain
      - pwsh: |
          cargo build --release --locked -p collector --bin collector-poc 2>&1 | Tee-Object -FilePath build.log
          cargo build --release --locked -p svc --bin defender-probe 2>&1 | Tee-Object -FilePath build.log -Append
        displayName: Build collector-poc (release)
      - pwsh: |
          cargo test --release --locked --workspace 2>&1 | Tee-Object -FilePath test.log
        displayName: Unit tests on Windows (graph, story, collector)
      - pwsh: |
          # Runner is admin. ETW session needs it.
          $exe = ".\target\release\collector-poc.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "55", "collector.db", "--experimental" `
                 -RedirectStandardOutput run.out -RedirectStandardError run.err -PassThru
          Start-Sleep -Seconds 4

          # Scenario 1: curl chain (baseline for attribution and rewind)
          & curl.exe -s --output NUL https://www.rust-lang.org/
          Start-Sleep -Seconds 1

          # Scenario P9: new file (.tmp) -> rename (.exe) -> execute -> Run key -> outbound
          $dl = Join-Path $env:TEMP "sfdl"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          $tmp = Join-Path $dl "payload.tmp"
          Copy-Item "$env:SystemRoot\System32\curl.exe" $tmp
          # simulate Mark-of-the-Web as a browser download would (A4 reads this)
          Set-Content -Path $tmp -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://example.com/payload.exe`r`n"
          Rename-Item -Path $tmp -NewName "payload.exe"
          $pl = Join-Path $dl "payload.exe"
          # A4: break the Authenticode signature by appending one byte (overlay); PE still runs
          [IO.File]::AppendAllText($pl, "x")
          & reg.exe add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v sfpoc /t REG_SZ /d "$pl" /f | Out-Null
          & $pl -s --output NUL https://api.github.com/
          Start-Sleep -Seconds 1

          # Scenario P7: DNS over HTTPS (bypasses DNS-Client ETW). Failure is informative too.
          & curl.exe -s --output NUL --doh-url https://cloudflare-dns.com/dns-query https://example.com/ 2>&1 | Out-Null
          Start-Sleep -Seconds 1

          # 10th ed. 5-9 (1): Kernel-Process start has no CommandLine -> collector reads it at start for recovery tools only.
          # Harmless read-only commands (no deletion). Expect ProcessCommand events with these exact lines.
          & vssadmin.exe list shadows | Out-Null
          & bcdedit.exe /enum "{current}" | Out-Null
          # 29th review Q1: renamed copy of vssadmin (OriginalFileName stays VSSADMIN.EXE) -> still collected, with tool=vssadmin.exe
          $vc = Join-Path $env:TEMP "sf_vsscopy.exe"
          Copy-Item "$env:SystemRoot\System32\vssadmin.exe" $vc -Force
          & $vc list shadows | Out-Null
          Start-Sleep -Seconds 1

          # 10th ed. 5-9 (3): CFA state source check (disposable runner VM). Registry path is not in Microsoft docs -> compare with Get-MpPreference,
          # flip to AuditMode once and back, and see the registry value follow.
          $cfaKey = 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Windows Defender Exploit Guard\Controlled Folder Access'
          function CfaReg { $v = (Get-ItemProperty $cfaKey -ErrorAction SilentlyContinue).EnableControlledFolderAccess; if ($null -eq $v) { 'none' } else { "$v" } }
          try {
            $mp0 = "$((Get-MpPreference -ErrorAction Stop).EnableControlledFolderAccess)"
            $r0 = CfaReg
            Set-MpPreference -EnableControlledFolderAccess AuditMode -ErrorAction Stop
            Start-Sleep -Seconds 2
            $mp1 = "$((Get-MpPreference).EnableControlledFolderAccess)"; $r1 = CfaReg
            # 10th ed. 5-9 (3): unsigned probe writes into Documents while in AuditMode -> event 1124 expected.
            # Field names of 1123/1124 are not in Microsoft docs -> dump the raw XML and our parser's view.
            $docs = [Environment]::GetFolderPath('MyDocuments')
            & .\target\release\defender-probe.exe write (Join-Path $docs "sf_cfa_probe.txt") | Tee-Object -FilePath cfa.txt -Append
            Start-Sleep -Seconds 5
            $xe = Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 300 -ErrorAction SilentlyContinue | Where-Object { $_.Id -in 1123, 1124 } | Select-Object -First 3
            "CFAEVT: count=$(@($xe).Count)" | Tee-Object -FilePath cfa.txt -Append
            foreach ($x in $xe) { $x.ToXml() | Tee-Object -FilePath cfa.txt -Append }
            & .\target\release\defender-probe.exe read | Tee-Object -FilePath cfa.txt -Append
            Remove-Item (Join-Path $docs "sf_cfa_probe.txt") -ErrorAction SilentlyContinue
            Set-MpPreference -EnableControlledFolderAccess Disabled -ErrorAction SilentlyContinue
            $ok = ($mp1 -eq $r1) -and (($r0 -eq 'none' -and $mp0 -eq '0') -or ($mp0 -eq $r0))
            "CFA: before mp=$mp0 reg=$r0 audit mp=$mp1 reg=$r1 match=$ok" | Tee-Object -FilePath cfa.txt -Append
          } catch {
            "CFA: defender unavailable ($($_.Exception.Message)) match=na" | Tee-Object -FilePath cfa.txt -Append
            & .\target\release\defender-probe.exe read | Tee-Object -FilePath cfa.txt -Append
          }

          # Short connection from PowerShell itself
          try { Invoke-WebRequest -Uri https://github.com -UseBasicParsing | Out-Null } catch {}

          # A4: Firefox (NSS, no schannel/CAPI2) headless -> its own PID attribution, no connected_via expected
          $ff = "C:\Program Files\Mozilla Firefox\firefox.exe"
          if (Test-Path $ff) {
            $fp = Start-Process -FilePath $ff -ArgumentList "-headless","https://example.org/" -PassThru
            Start-Sleep -Seconds 6
            try { Stop-Process -Id $fp.Id -Force -ErrorAction SilentlyContinue } catch {}
            Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } else { "firefox not found" }

          # 23rd review Q2: wall clock jump while the ETW session runs. ETW times now come as raw QPC and are
          # converted with (QPC, wall) pairs taken every second, so an event after the jump must carry the NEW wall time.
          # (Before: ETW converted with the session-start base -> ~150 s off, as Sysmon was in B2 run 3.)
          # Azure 러너는 Hyper-V 시간 동기화(vmictimesync)가 우리 Set-Date 를 몇 초 안에 되돌린다 — 그 되돌림이 쌍 간격(1초) 안에
          # 끼면 판정이 흔들린다(2026-11-03 windows-2022: -149977ms). 시험 동안 둘 다 멈춘다
          Stop-Service w32time, vmictimesync -ErrorAction SilentlyContinue
          Set-Date -Adjust ([TimeSpan]::FromSeconds(-150)) | Out-Null
          Start-Sleep -Seconds 3
          (Get-Date).ToFileTimeUtc() | Set-Content clockmark.txt
          & "$env:SystemRoot\System32\whoami.exe" | Out-Null
          Start-Sleep -Seconds 1
          Set-Date -Adjust ([TimeSpan]::FromSeconds(150)) | Out-Null
          Start-Service w32time, vmictimesync -ErrorAction SilentlyContinue

          # Scenario P8 (load, 4th review M1): bandwidth + many distinct connections + file churn, concurrently.
          # (a) 100MB download -> thousands of recv events on one connection
          $dl1 = Start-Process -FilePath "curl.exe" -ArgumentList '-sL','--output','NUL','-w','"download_bytes=%{size_download} time=%{time_total} speed=%{speed_download} http=%{http_code}"','"https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/PortableGit-2.47.1-64-bit.7z.exe"' -RedirectStandardOutput p8.txt -RedirectStandardError p8.err -PassThru
          # (b) 300 connect/close to a local listener on distinct source ports (+ 100 to distinct public IPs)
          $lst = Start-Job {
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 47555); $l.Start()
            $end = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $end) { if ($l.Pending()) { $c = $l.AcceptTcpClient(); $c.Close() } else { Start-Sleep -Milliseconds 5 } }
            $l.Stop()
          }
          Start-Sleep -Seconds 1
          $conn = Start-Job {
            for ($i = 0; $i -lt 300; $i++) {
              try { $c = [System.Net.Sockets.TcpClient]::new(); $c.Connect("127.0.0.1", 47555); $c.Close() } catch {}
            }
            # distinct public IPs: 1.0.0.0/24 style sweep against port 443 with 300ms timeout (SYN only, most time out)
            for ($i = 1; $i -le 100; $i++) {
              try { $c = [System.Net.Sockets.TcpClient]::new(); $null = $c.ConnectAsync("1.1.1.$i", 443).Wait(300); $c.Close() } catch {}
            }
          }
          # (c) 500 temp files create/rename/delete
          $files = Start-Job -ArgumentList $dl {
            param($dl)
            for ($i = 0; $i -lt 500; $i++) {
              $t = Join-Path $dl ("churn$i.tmp"); Set-Content -Path $t -Value "x"; Rename-Item $t ("churn$i.dat"); Remove-Item (Join-Path $dl ("churn$i.dat"))
            }
          }
          Wait-Job $conn, $files -Timeout 30 | Out-Null
          Wait-Job $lst -Timeout 25 | Out-Null
          Receive-Job $conn, $files -ErrorAction SilentlyContinue | Out-Null
          Wait-Process -Id $dl1.Id -Timeout 30 -ErrorAction SilentlyContinue
          "=== P8 download ==="; Get-Content p8.txt -ErrorAction SilentlyContinue; Get-Content p8.err -ErrorAction SilentlyContinue

          Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          & reg.exe delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v sfpoc /f | Out-Null
          [Environment]::OSVersion.VersionString | Set-Content osver.txt
          (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion").DisplayVersion + " build " + (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion").CurrentBuild | Add-Content osver.txt
          "=== OS ==="; Get-Content osver.txt
          "=== STDOUT ==="; Get-Content run.out
          "=== STDERR (first 200 lines) ==="; Get-Content run.err -TotalCount 200
        displayName: Run 45 seconds as admin with scenario
      - pwsh: |
          # clock jump check: whoami start (ETW) vs wall time written right before it (both after the -150 s jump)
          $py = @'
          import sqlite3, json, sys
          mark = int(open("clockmark.txt").read().strip())
          c = sqlite3.connect("collector.db")
          best = None
          for (p,) in c.execute("SELECT payload_json FROM raw_events WHERE source = 'etw:process'"):
              e = json.loads(p)
              if str(e.get("image", "")).lower().endswith("\\whoami.exe"):
                  d = (e["ts"] - mark) / 10000
                  if best is None or abs(d) < abs(best):
                      best = d
          print("CLOCKJUMP: whoami_etw_minus_wall_ms=%s %s" % (best, "ok" if best is not None and -500 <= best <= 3000 else "bad"))
          '@
          $py += @'

          cmds = []
          # run-84: the command line arrives from the kernel session (source etw:kernel-process); the direct-read fallback uses etw:process
          for (p,) in c.execute("SELECT payload_json FROM raw_events WHERE source IN ('etw:process', 'etw:kernel-process')"):
              e = json.loads(p)
              if e.get("kind") == "process_command":
                  cmds.append(e.get("cmdline", ""))
          tools = [e2.get("tool") for e2 in [json.loads(p) for (p,) in c.execute("SELECT payload_json FROM raw_events WHERE source IN ('etw:process', 'etw:kernel-process')")] if e2.get("kind") == "process_command"]
          renamed = [t for t in tools if t]
          print("CMDLINE: renamed_tool=%d %s" % (len(renamed), renamed[:3]))
          vss = [x for x in cmds if "vssadmin" in x.lower() and "list shadows" in x.lower()]
          bcd = [x for x in cmds if "bcdedit" in x.lower() and "/enum" in x.lower()]
          print("CMDLINE: total=%d vssadmin_list=%d bcdedit_enum=%d %s" % (len(cmds), len(vss), len(bcd), "ok" if vss and bcd else "bad"))
          for x in cmds[:5]:
              print("CMDLINE: line=%r" % x)
          '@
          $py | Set-Content clockcheck.py -Encoding ascii
          python clockcheck.py 2>&1 | Add-Content run.out
          Get-Content run.out | Select-String "CLOCKJUMP|clock:|CMDLINE:"
          if (Test-Path cfa.txt) { Get-Content cfa.txt | Add-Content run.out }
          $log = Get-Content run.out -Raw -ErrorAction SilentlyContinue
          $expect = @(
            'events_ingested=[1-9]\d* edges_created=[1-9]\d*'
            'dropped=0 rate_limited=0 missing_fields=0'
            'curl\.exe -> [\w.:-]+:443 :: remote:'
            '"sig_status":"valid","signer":"Microsoft'
            'A20: hashes=[1-9]\d* store_failed=0'
            'hash: payload\.exe sha256=[0-9a-f]{64} motw=true'
            'A30: process_sessions=[1-9]\d*/\d+ etw_session_events=[1-9]\d*'
            'B2fix: inbound_lport_47555=[1-9]\d* inbound_rport_47555=0'
            'clock: jumps=[1-9]\d* max_jump_ms=(1[4-9]\d{4}|[2-9]\d{5})'
            'CLOCKJUMP: whoami_etw_minus_wall_ms=\S+ ok'
            'CMDLINE: total=\d+ vssadmin_list=[1-9]\d* bcdedit_enum=[1-9]\d* ok'
            'CMDLINE: renamed_tool=[1-9]'
            'CFA: .*match=(True|na)'
            'PROBE (events=\d+|read error)'
          )
          $bad = 0
          foreach ($p in $expect) {
            if ($log -match $p) { "PASS  $p" } else { "FAIL  $p"; $bad++ }
          }
          "assert: $bad failed of $($expect.Count)" | Tee-Object -FilePath assert.txt
          if ($bad -gt 0) { exit 1 }
        displayName: Assert expected outcomes
        condition: always()
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item assert.txt, build.log, test.log, run.out, run.err, osver.txt, p8.txt, p8.err, cfa.txt $run -ErrorAction SilentlyContinue
          pwsh -NoProfile -File .azure/push-log.ps1 -Name poc3 -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  - job: poc4
    displayName: poc4 (poc4-svc-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.poc4'], 'true'))
    timeoutInMinutes: 60
    pool:
      vmImage: windows-2025
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo --version
        displayName: Rust toolchain
      - pwsh: |
          cargo test --release --locked -p svc -p api -p engine -p graph -- --nocapture 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
        displayName: Unit tests on Windows (svc, api, engine, graph)
      - pwsh: |
          cargo build --release --locked -p svc --features test-signer --bin svc-poc --bin story-firewall-svc 2>&1 | Tee-Object -FilePath build.log
        displayName: Build svc-poc
      - pwsh: |
          $exe = ".\target\release\svc-poc.exe"
          Copy-Item $exe ".\target\release\svc-poc-unsigned.exe"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=StoryFirewall Test" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $pfx = Join-Path $env:RUNNER_TEMP "test.cer"
          Export-Certificate -Cert $cert -FilePath $pfx | Out-Null
          # 자체 서명 루트를 신뢰 저장소에 넣어야 WinVerifyTrust(오프라인) 가 valid 를 돌려준다
          Import-Certificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $r = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256
          "sign status: $($r.Status) $($r.StatusMessage)"
          (Get-AuthenticodeSignature $exe).Status
        displayName: Sign with a self-signed test certificate
      - pwsh: |
          $exe = ".\target\release\svc-poc.exe"
          $unsigned = ".\target\release\svc-poc-unsigned.exe"
          $log = "run.out"
          function Log($s) { $s | Tee-Object -FilePath $log -Append }

          Log "=== 0. timezone ==="
          & $exe tz 2>&1 | Tee-Object -FilePath $log -Append

          # 비관리자 클라이언트용 표준 사용자 (제안 2 수용: Unauthorized 경로를 실제 토큰으로 실측)
          $pw = "Sf-Poc-" + [guid]::NewGuid().ToString("N").Substring(0, 12) + "!"
          net user sfpocuser $pw /add /y | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential("sfpocuser", (ConvertTo-SecureString $pw -AsPlainText -Force))
          # 표준 사용자가 실행 파일을 읽을 수 있게
          icacls (Split-Path (Resolve-Path $exe)) /grant "sfpocuser:(OI)(CI)RX" /T | Out-Null

          Log "=== 1. server (expects 3 connections) ==="
          $srv = Start-Process -FilePath $exe -ArgumentList 'server','"StoryFirewall Test"','3'  -RedirectStandardOutput server.out -RedirectStandardError server.err -PassThru
          Start-Sleep -Seconds 3

          Log "=== 2. signed client: hello -> policy.list -> settings.set (admin) ==="
          & $exe client 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 1

          Log "=== 3. unsigned client: must be rejected before hello ==="
          & $unsigned client 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 1

          Log "=== 4. signed client as standard user: settings.set must be Unauthorized (-32001) ==="
          $abs = (Resolve-Path $exe).Path
          $na = Start-Process -FilePath $abs -ArgumentList 'client' -Credential $cred -WorkingDirectory (Split-Path $abs) -RedirectStandardOutput nonadmin.out -RedirectStandardError nonadmin.err -PassThru
          Wait-Process -Id $na.Id -Timeout 30 -ErrorAction SilentlyContinue
          Get-Content nonadmin.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Get-Content nonadmin.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append

          Wait-Process -Id $srv.Id -Timeout 30 -ErrorAction SilentlyContinue
          if (-not $srv.HasExited) { Stop-Process -Id $srv.Id -Force; Log "server killed (timeout)" }
          Log "--- server.out ---"; Get-Content server.out | Tee-Object -FilePath $log -Append
          Log "--- server.err ---"; Get-Content server.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          function AsUser($argList, $tag) {
            $p = Start-Process -FilePath $abs -ArgumentList $argList -Credential $cred -WorkingDirectory (Split-Path $abs) -RedirectStandardOutput "$tag.out" -RedirectStandardError "$tag.err" -PassThru
            Wait-Process -Id $p.Id -Timeout 30 -ErrorAction SilentlyContinue
            Get-Content "$tag.out" -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
            Get-Content "$tag.err" -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          }
          Log "=== 11. A25: pipe DACL - can a standard user add a server instance? (legacy GRGW vs fixed) ==="
          $demo = Start-Process -FilePath $exe -ArgumentList 'sddl-demo','25' -RedirectStandardOutput demo.out -PassThru
          Start-Sleep -Seconds 2
          Get-Content demo.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          AsUser @('squat-instance','\\.\pipe\sf-demo-legacy') 'sq-legacy'
          AsUser @('squat-instance','\\.\pipe\sf-demo-fixed') 'sq-fixed'
          Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue

          Log "=== 12. A25: standard user squats the fixed pipe name before the service starts ==="
          $squat = Start-Process -FilePath $abs -ArgumentList 'squat-hold','\\.\pipe\story-firewall','60' -Credential $cred -WorkingDirectory (Split-Path $abs) -RedirectStandardOutput squat.out -RedirectStandardError squat.err -PassThru
          Start-Sleep -Seconds 3
          Get-Content squat.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append

          Log "=== 5. SCM: install -> start -> time change -> stop -> uninstall ==="
          $svclog = Join-Path (Get-Location) "service.log"
          & $exe install $svclog "StoryFirewall Test" 2>&1 | Tee-Object -FilePath $log -Append
          & $exe sc-start 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 3
          & $exe sc-state 2>&1 | Tee-Object -FilePath $log -Append
          Log "=== 13. A25: clients reach the LocalSystem service through the published random name ==="
          & $exe client 2>&1 | Tee-Object -FilePath $log -Append
          AsUser @('probe') 'probe'
          $pub = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\StoryFirewall' -Name PipeName -ErrorAction SilentlyContinue).PipeName
          Log "published=$pub"
          if ($pub) { AsUser @('squat-instance', $pub) 'sq-live' }
          # 시스템 시각을 2분 앞당겼다가 되돌린다 -> SERVICE_CONTROL_TIMECHANGE 두 번 기대
          Set-Date -Adjust (New-TimeSpan -Minutes 2) | Out-Null
          Start-Sleep -Seconds 2
          Set-Date -Adjust (New-TimeSpan -Minutes -2) | Out-Null
          Start-Sleep -Seconds 2
          & $exe sc-stop 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 3
          & $exe sc-state 2>&1 | Tee-Object -FilePath $log -Append
          & $exe uninstall 2>&1 | Tee-Object -FilePath $log -Append
          $after = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\StoryFirewall' -Name PipeName -ErrorAction SilentlyContinue).PipeName
          Log "published_after_stop=[$after]"
          Stop-Process -Id $squat.Id -Force -ErrorAction SilentlyContinue
          Log "--- service.log ---"; Get-Content $svclog -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append

          Log "=== 14. A26: product service story-firewall-svc (real WFP, data dir, published pipe) ==="
          $prod = ".\target\release\story-firewall-svc.exe"
          # 21st review: old moved-aside folders are capped at 5 (7 pre-made + 1 new -> 5)
          1..7 | ForEach-Object { New-Item -ItemType Directory -Path ("C:\ProgramData\StoryFirewall.untrusted-" + $_) -Force | Out-Null }
          # a standard user pre-creates the data folder with a planted policy DB
          AsUser @('plant','C:\ProgramData\StoryFirewall') 'plant'
          & $prod install --test-signer "StoryFirewall Test" 2>&1 | Tee-Object -FilePath $log -Append
          & $prod start 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Seconds 6
          & $prod status 2>&1 | Tee-Object -FilePath $log -Append
          Log "--- 14b. clients ---"
          & $exe client 2>&1 | Tee-Object -FilePath $log -Append
          & $exe wfp-roundtrip 2>&1 | Tee-Object -FilePath $log -Append
          AsUser @('probe') 'probe2'
          & $prod stop 2>&1 | Tee-Object -FilePath $log -Append
          Log "--- product service.log ---"
          Get-Content 'C:\ProgramData\StoryFirewall\service.log' -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Get-ChildItem 'C:\ProgramData' -Filter 'StoryFirewall*' | ForEach-Object { Log ("data dir entry: " + $_.Name) }
          & $prod uninstall 2>&1 | Tee-Object -FilePath $log -Append
          Log "--- after uninstall ---"
          & $prod status 2>&1 | Tee-Object -FilePath $log -Append
          $kept = (Get-ChildItem 'C:\ProgramData' -Filter 'StoryFirewall.untrusted-*').Count
          Log "untrusted folders kept=$kept"

          Log "=== 15. A26/21st: standard user holds the planted data folder (no share-delete) -> fallback folder ==="
          $hold = Start-Process -FilePath $abs -ArgumentList 'plant-hold','C:\ProgramData\SFHoldBase','40' -Credential $cred -WorkingDirectory (Split-Path $abs) -RedirectStandardOutput hold.out -RedirectStandardError hold.err -PassThru
          Start-Sleep -Seconds 3
          Get-Content hold.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          & $prod console 8 --test-signer "StoryFirewall Test" --data-base 'C:\ProgramData\SFHoldBase' 2>&1 | Tee-Object -FilePath $log -Append
          $fb = Get-ChildItem 'C:\ProgramData' -Filter 'SFHoldBase.*' | Where-Object { $_.Name -match '^SFHoldBase\.[0-9a-f]{16}$' } | Select-Object -First 1
          Log ("fallback folder: " + $(if ($fb) { $fb.Name } else { "none" }))
          if ($fb) { Get-Content (Join-Path $fb.FullName 'service.log') -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append }
          Stop-Process -Id $hold.Id -Force -ErrorAction SilentlyContinue

          Log "=== 6. TerminateProcess with create-time check ==="
          $victim = Start-Process -FilePath "$env:SystemRoot\System32\ping.exe" -ArgumentList "-t","127.0.0.1" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 1
          $ct = (& $exe create-time $victim.Id) -replace '.*Some\((\d+)\).*','$1'
          Log "victim pid=$($victim.Id) create_time=$ct"
          & $exe kill $victim.Id ($([int64]$ct) + 1) 2>&1 | Tee-Object -FilePath $log -Append
          Log ("victim alive after mismatch kill (expect True): " + (-not $victim.HasExited))
          & $exe kill $victim.Id $ct 2>&1 | Tee-Object -FilePath $log -Append
          Start-Sleep -Milliseconds 500
          $victim.Refresh()
          Log ("victim alive after matching kill (expect False): " + (-not $victim.HasExited))

          Log "=== 8. A19: listeners (GetExtendedTcpTable LISTEN + GetExtendedUdpTable) ==="
          & $exe listeners 2>&1 | Tee-Object -FilePath $log -Append

          Log "=== 7. A18: collector session + engine (sink batches reach the engine) ==="
          $col = Start-Process -FilePath $exe -ArgumentList 'collect','12','svc-collect.db' -RedirectStandardOutput collect.out -RedirectStandardError collect.err -PassThru
          Start-Sleep -Seconds 4
          # 세션 중에 새 프로세스·연결을 만든다
          & "$env:SystemRoot\System32\curl.exe" -s -o NUL https://www.rust-lang.org/ 2>$null
          & "$env:SystemRoot\System32\where.exe" cmd 2>$null | Out-Null
          Wait-Process -Id $col.Id -Timeout 60 -ErrorAction SilentlyContinue
          Get-Content collect.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Get-Content collect.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append

          Log "=== 10. A24: pipe read race (requests at 200ms slice boundaries) ==="
          $ss = Start-Process -FilePath $exe -ArgumentList 'server','"StoryFirewall Test"','1' -RedirectStandardOutput stress-server.out -RedirectStandardError stress-server.err -PassThru
          Start-Sleep -Seconds 3
          & $exe stress 300 2>&1 | Tee-Object -FilePath $log -Append
          Wait-Process -Id $ss.Id -Timeout 15 -ErrorAction SilentlyContinue
          if (-not $ss.HasExited) { Stop-Process -Id $ss.Id -Force }

          Log "=== 9. graph lock fairness on Windows ==="
          Get-Content test.log | Select-String "busy batches=" | ForEach-Object { Log $_.Line }
          Log "END"
          net user sfpocuser /delete | Out-Null
        displayName: Run scenario
      - pwsh: |
          $log = Get-Content run.out -Raw -ErrorAction SilentlyContinue
          $expect = @(
            'local_offset_minutes=-?\d+'
            'wall_is_utc=true'
            '=== 2\..*\r?\n(.*\r?\n)*?client: \{"jsonrpc":"2\.0","id":1,"result":\{"api":\[1,0\]'
            'client: \{"jsonrpc":"2\.0","id":2,"result":\{"items":\[\]\}\}'
            'client: \{"jsonrpc":"2\.0","id":3,"result":\{"ok":true\}\}'
            '=== 3\..*\r?\n(.*\r?\n)*?client: closed by server'
            '=== 4\..*\r?\n(.*\r?\n)*?client: \{"jsonrpc":"2\.0","id":3,"error":\{"code":-32001'
            'signature_ok=true \(.*svc-poc\.exe: status=valid signer=Some\("StoryFirewall Test"\)'
            'authn: admin=true'
            'authn: admin=false'
            'svc-poc-unsigned\.exe: status=nosignature.*\r?\n.*closed: signature_failed'
            'install: ok'
            '=== 5\..*\r?\n(.*\r?\n)*?state=4'
            '=== 5\..*\r?\n(.*\r?\n)*?state=1'
            'uninstall: ok'
            'service: running'
            'event: TimeChanged(.*\r?\n)*?.*event: TimeChanged'
            'event: Stop'
            'service: stopped'
            'CreateTimeMismatch'
            'victim alive after mismatch kill \(expect True\): True'
            '-> Terminated'
            'victim alive after matching kill \(expect False\): False'
            'collect: ingested=[1-9]\d* edges=[1-9]\d* dropped=0 lost=Some\(0\)'
            'collect: sink batches=[1-9]\d* events=[1-9]\d* process_starts=[1-9]\d*'
            'collect: process_nodes=[1-9]\d*'
            'listeners: tcp=[1-9]\d* udp=[1-9]\d*'
            'busy batches=\d+ worst engine wait='
            'listener: tcp 0\.0\.0\.0:135 pid=\d+ any=true'
            'stress: done n=300 lost=0'
            'squat-instance: \\\\\.\\pipe\\sf-demo-legacy created \(VULNERABLE\)'
            'squat-instance: \\\\\.\\pipe\\sf-demo-fixed denied'
            'squat-hold: holding'
            'squat: fixed pipe name held by pid=[1-9]\d*'
            'pipe: published \\\\\.\\pipe\\story-firewall-[0-9a-f]{32}'
            '=== 13\..*\r?\n(.*\r?\n)*?client: pipe=\\\\\.\\pipe\\story-firewall-[0-9a-f]{32}(.*\r?\n)*?client: \{"jsonrpc":"2\.0","id":3,"result":\{"ok":true\}\}'
            'probe: name=\\\\\.\\pipe\\story-firewall-[0-9a-f]{32} valid=true server_pid=[1-9]\d* session=0'
            'probe: hello ok'
            'squat-instance: \\\\\.\\pipe\\story-firewall-[0-9a-f]{32} denied'
            'pipe: unpublished'
            'published_after_stop=\[\]'
            'plant: created'
            'install: ok \(".*story-firewall-svc\.exe" run --test-signer'
            'start: ok state=Some\(4\)'
            'status: state=4 published=\\\\\.\\pipe\\story-firewall-[0-9a-f]{32} wfp_filters=\d+ data_dir=.*StoryFirewall owner_trusted=true'
            '--- 14b\..*\r?\n(.*\r?\n)*?client: \{"jsonrpc":"2\.0","id":3,"result":\{"ok":true\}\}'
            'roundtrip: baseline=0 blocked=[1-9]\d* filters=2 after=0 confirm_ok=true rollback_ok=true'
            'data_dir: untrusted folder moved aside'
            'collector: started'
            'service: stopped'
            'data dir entry: StoryFirewall\.untrusted-\d+'
            'uninstall: wfp filters removed=\d+'
            '--- after uninstall ---\r?\n.*status: state=\(.*\) published=- wfp_filters=0'
            'data_dir: pruned \d+ old untrusted folders \(keep 5\)'
            'untrusted folders kept=5'
            'plant-hold: holding'
            'fallback folder: SFHoldBase\.[0-9a-f]{16}'
            'data_dir: fallback \(could not move untrusted base: .*\) -> .*SFHoldBase\.[0-9a-f]{16}'
            'console: done'
          )
          $bad = 0
          foreach ($p in $expect) {
            if ($log -match $p) { "PASS  $p" } else { "FAIL  $p"; $bad++ }
          }
          "assert: $bad failed of $($expect.Count)" | Tee-Object -FilePath assert.txt
          if ($bad -gt 0) { exit 1 }
        displayName: Assert expected outcomes
        condition: always()
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item assert.txt, build.log, test.log, run.out, server.out, server.err, service.log, collect.out, collect.err, probe.out, squat.out $run -ErrorAction SilentlyContinue
          pwsh -NoProfile -File .azure/push-log.ps1 -Name poc4 -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  - job: poc5
    displayName: poc5 (poc5-ui-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.poc5'], 'true'))
    timeoutInMinutes: 75
    pool:
      vmImage: windows-2022
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo --version
        displayName: Rust toolchain
      - task: UseNode@1
        inputs:
          versionSource: spec
          version: "22.x"
      - pwsh: |
          npm ci
          npm run build
        displayName: Frontend
        workingDirectory: ui
      - pwsh: |
          $env:RUSTFLAGS = "-D warnings"
          npx tauri build --no-bundle --features e2e-cdp 2>&1 | Tee-Object -FilePath ../build-ui.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item src-tauri/target/release/story-firewall-ui.exe | Select-Object Name, Length
        displayName: Tauri app (tauri build --no-bundle, embeds dist)
        workingDirectory: ui
      - pwsh: |
          cargo build --release --locked -p svc --features test-signer --bin svc-poc 2>&1 | Tee-Object -FilePath build-svc.log
        displayName: Build svc-poc (test-signer)
      - pwsh: |
          $exe = "ui\src-tauri\target\release\story-firewall-ui.exe"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=StoryFirewall Test" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $cer = Join-Path $env:RUNNER_TEMP "test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $r = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256
          "sign status: $($r.Status)"
        displayName: Sign UI with a self-signed test certificate
      - pwsh: |
          $log = "ui-e2e.out"
          function Log($s) { $s | Tee-Object -FilePath $log -Append }
          $svc = Start-Process -FilePath ".\target\release\svc-poc.exe" -ArgumentList 'server','"StoryFirewall Test"','8','--demo','--concurrent' -RedirectStandardOutput svc.out -RedirectStandardError svc.err -PassThru
          Start-Sleep -Seconds 2
          # 환경 변수는 설정의 additionalBrowserArgs 를 대신하므로(추측: WebView2 는 환경 변수를 우선) 같은 인자를 앞에 붙여 실제 앱과 같게 잰다
          $cfgArgs = (Get-Content ui\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).app.windows[0].additionalBrowserArgs
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "$cfgArgs --remote-debugging-port=9222"
          # A23: approval helper auto-answer file (e2e-cdp build only; release ignores it)
          $env:STORYFW_E2E_APPROVE_OUT = Join-Path $PWD "approve-out.txt"
          $ui = Start-Process -FilePath ".\ui\src-tauri\target\release\story-firewall-ui.exe" -PassThru
          Remove-Item Env:\WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          # UI 자신의 외부 통신 측정(노트북 L015 발견 2): UI 와 그 자손(msedgewebview2)의 TCP 원격 주소를 1초마다, 처음 본 것만 기록
          $egress = Start-Job -ArgumentList $ui.Id {
            param($root)
            $seen = @{}
            $end = (Get-Date).AddSeconds(240)
            while ((Get-Date) -lt $end) {
              $all = Get-CimInstance Win32_Process
              $kids = @($root)
              do { $n = $kids.Count; $kids = @($kids + @($all | Where-Object { $kids -contains $_.ParentProcessId } | ForEach-Object { $_.ProcessId }) | Select-Object -Unique) } while ($kids.Count -ne $n)
              Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { $kids -contains $_.OwningProcess -and $_.RemoteAddress -notmatch '^(127\.|::1$|0\.0\.0\.0$|::$)' } | ForEach-Object {
                $name = ($all | Where-Object ProcessId -eq $_.OwningProcess | Select-Object -First 1).Name
                $k = "$name $($_.RemoteAddress):$($_.RemotePort)"
                if (-not $seen.ContainsKey($k)) { $seen[$k] = 1; "ui-egress: $k $($_.State)" }
              }
              Start-Sleep -Seconds 1
            }
          }
          Push-Location ui
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
          npm install --no-save playwright@1.63.0 2>&1 | Out-Null
          node scripts/e2e-tauri.mjs 9222 ..\e2e-tauri-out 2>&1 | Tee-Object -FilePath ..\$log -Append
          $rc = $LASTEXITCODE
          Pop-Location
          Stop-Job $egress -ErrorAction SilentlyContinue
          $eg = @(Receive-Job $egress -ErrorAction SilentlyContinue)
          Log ("ui-egress-count: " + $eg.Count)
          $eg | ForEach-Object { Log $_ }
          # 판정(2026-11-03 고정): 보안 제품 UI 는 실행 중 스스로 외부에 접속하지 않는다 (WebView2 백그라운드 네트워킹 끔, 8ab3273 에서 0 확인)
          if ($eg.Count -gt 0) { Log "FAIL ui made external connections"; $rc = 1 } else { Log "PASS ui made no external connections" }
          Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue
          Log "--- svc.out ---"; Get-Content svc.out | Tee-Object -FilePath $log -Append
          Log "--- svc.err ---"; Get-Content svc.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          exit $rc
        displayName: Real UI end-to-end (WebView2 + CDP + svc-poc pipe)
      - pwsh: |
          $out = Join-Path $PWD "approve-selftest.txt"
          $p = Start-Process -FilePath ".\ui\src-tauri\target\release\story-firewall-ui.exe" -ArgumentList '--approve-selftest',"`"$out`"" -PassThru
          $null = $p.Handle  # keep a handle so ExitCode is available after exit
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $PWD "approve-window.png"))
          $g.Dispose(); $bmp.Dispose()
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; "selftest timeout" | Tee-Object -FilePath approve-selftest.txt -Append; exit 1 }
          "exit=$($p.ExitCode)" | Tee-Object -FilePath approve-selftest.txt -Append
          Get-Content approve-selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
        displayName: Approval window self-test (A24 clickjacking guard, screenshot)
      - pwsh: |
          $log = "ui-user.out"
          function Log($s) { $s | Tee-Object -FilePath $log -Append }
          # standard user (Users group only)
          $pw = "Sf!" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "a1"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name sfuiuser -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member sfuiuser -ErrorAction SilentlyContinue
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\sfuiuser", $sec)
          Log ("groups: " + ((Get-LocalGroup | Where-Object { (Get-LocalGroupMember $_ -ErrorAction SilentlyContinue).Name -match 'sfuiuser' }).Name -join ","))
          $exe = (Resolve-Path ".\ui\src-tauri\target\release\story-firewall-ui.exe").Path
          icacls (Split-Path $exe) /grant "sfuiuser:(OI)(CI)RX" /T | Out-Null
          # UAC stand-in: the user's UI drops req-<id>.txt, the admin side runs the helper elevated and writes done-<id>.txt
          $uac = Join-Path $env:RUNNER_TEMP "uac"
          New-Item -ItemType Directory -Path $uac -Force | Out-Null
          icacls $uac /grant "sfuiuser:(OI)(CI)M" | Out-Null
          $aout = Join-Path $PWD "approve-user.txt"
          $svc = Start-Process -FilePath ".\target\release\svc-poc.exe" -ArgumentList 'server','"StoryFirewall Test"','16','--demo','--concurrent' -RedirectStandardOutput svc-user.out -RedirectStandardError svc-user.err -PassThru
          Start-Sleep -Seconds 2
          $standin = Start-Job -ArgumentList $uac, $exe, $aout {
            param($dir, $exe, $out)
            $end = (Get-Date).AddMinutes(8)
            while ((Get-Date) -lt $end) {
              Get-ChildItem $dir -Filter 'req-*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
                $id = $_.BaseName.Substring(4)
                Remove-Item $_.FullName -Force
                $p = Start-Process -FilePath $exe -ArgumentList '--approve', $id, '--e2e-auto', "`"$out`"" -PassThru -Wait
                Set-Content -Path (Join-Path $dir "done-$id.txt") -Value $p.ExitCode
                "helper $id exit=$($p.ExitCode)"
              }
              Start-Sleep -Milliseconds 300
            }
          }
          $uiArgs = @('--e2e-env', 'WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9223', '--e2e-env', "STORYFW_E2E_UAC_DIR=$uac")
          $ui = Start-Process -FilePath $exe -ArgumentList $uiArgs -Credential $cred -LoadUserProfile -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 5
          $owner = (Get-Process -Id $ui.Id -IncludeUserName -ErrorAction SilentlyContinue).UserName
          Log "ui pid=$($ui.Id) owner=$owner"
          Push-Location ui
          $env:STORYFW_E2E_APPROVE_OUT = $aout
          node scripts/e2e-tauri.mjs 9223 ..\e2e-user-out user 2>&1 | Tee-Object -FilePath ..\$log -Append
          $rc = $LASTEXITCODE
          Pop-Location
          if ($owner -notmatch 'sfuiuser') { Log "FAIL ui process owner is not sfuiuser ($owner)"; $rc = 1 } else { Log "PASS ui process owner is sfuiuser" }
          Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue
          Stop-Job $standin -ErrorAction SilentlyContinue
          Log "--- stand-in ---"; Receive-Job $standin -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Log "--- svc-user.out ---"; Get-Content svc-user.out -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Log "--- svc-user.err ---"; Get-Content svc-user.err -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          Remove-LocalUser -Name sfuiuser -ErrorAction SilentlyContinue
          exit $rc
        displayName: A27 real UI as a standard user (view mode, approval helper via UAC stand-in)
        condition: always()
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item build-ui.log, build-svc.log, ui-e2e.out $run -ErrorAction SilentlyContinue
          if (Test-Path e2e-tauri-out) { Copy-Item e2e-tauri-out\* $run -Recurse -ErrorAction SilentlyContinue }
          Copy-Item approve-selftest.txt, approve-window.png, ui-user.out, approve-user.txt $run -ErrorAction SilentlyContinue
          if (Test-Path e2e-user-out) { $u = Join-Path $run "user"; New-Item -ItemType Directory -Path $u -Force | Out-Null; Copy-Item e2e-user-out\* $u -ErrorAction SilentlyContinue }
          pwsh -NoProfile -File .azure/push-log.ps1 -Name poc5 -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  - job: a28
    displayName: a28 (a28-installer-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.a28'], 'true'))
    timeoutInMinutes: 75
    pool:
      vmImage: windows-2022
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
      - pwsh: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ri = Join-Path $env:AGENT_TEMPDIRECTORY "rustup-init.exe"
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile $ri
            & $ri -y --profile minimal --default-toolchain stable
            $cb = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cb;$env:PATH"
            Write-Host "##vso[task.prependpath]$cb"
          }
          rustup default stable
          cargo --version
        displayName: Rust toolchain
      - task: UseNode@1
        inputs:
          versionSource: spec
          version: "22.x"
      - pwsh: |
          git fetch --depth 1 origin geo-data
          New-Item -ItemType Directory -Force ui\src-tauri\geo | Out-Null
          git archive FETCH_HEAD | tar -x -C ui/src-tauri/geo
          Get-ChildItem ui\src-tauri\geo
        displayName: Fetch geo data
      - pwsh: |
          cargo build --release --locked -p svc --features test-signer --bin story-firewall-svc --bin svc-poc 2>&1 | Tee-Object -FilePath build-svc.log
          New-Item -ItemType Directory -Force ui\src-tauri\binaries | Out-Null
          Copy-Item target\release\story-firewall-svc.exe ui\src-tauri\binaries\story-firewall-svc-x86_64-pc-windows-msvc.exe
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=StoryFirewall Test" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $cer = Join-Path $env:RUNNER_TEMP "test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $r = Set-AuthenticodeSignature -FilePath target\release\svc-poc.exe -Certificate $cert -HashAlgorithm SHA256
          "sign svc-poc: $($r.Status)"
        displayName: Build service (test-signer, CI only) and signed test client
      - pwsh: |
          cargo test --release --lib 2>&1 | Tee-Object -FilePath ..\..\test-ui.log
        displayName: UI core unit tests (tray watchdog)
        workingDirectory: ui/src-tauri
      - pwsh: |
          npm ci
          npx tauri build --config src-tauri/tauri.installer.conf.json 2>&1 | Tee-Object -FilePath ../build-installer.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem src-tauri\target\release\bundle\nsis | Select-Object Name, Length
        displayName: Build NSIS installer
        workingDirectory: ui
      - pwsh: |
          $log = "installer-test.txt"
          $bad = 0
          function Log($s) { $s | Tee-Object -FilePath $log -Append }
          function Check($ok, $msg) { if ($ok) { Log "PASS  $msg" } else { Log "FAIL  $msg"; $script:bad++ } }
          $setup = (Get-ChildItem ui\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1).FullName
          Log "setup=$setup"
          $dir = Join-Path $env:ProgramFiles "Story Firewall"
          $svcExe = Join-Path $dir "story-firewall-svc.exe"
          $runKey = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run"
          function SvcState { (Get-Service StoryFirewall -ErrorAction SilentlyContinue).Status }

          # 1. install
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          Log "install exit=$($p.ExitCode)"
          Check (Test-Path (Join-Path $dir "story-firewall-ui.exe")) "ui exe in Program Files"
          Check (Test-Path $svcExe) "svc exe in Program Files"
          Check ((Test-Path (Join-Path $dir "geo\dbip-country-lite.mmdb")) -and (Test-Path (Join-Path $dir "geo\dbip-asn-lite.mmdb"))) "geo data installed"
          for ($i = 0; $i -lt 20 -and (SvcState) -ne "Running"; $i++) { Start-Sleep -Seconds 1 }
          Check ((SvcState) -eq "Running") "service running after install ($(SvcState))"
          $st = & $svcExe status 2>&1 | Out-String
          Log $st
          Check ($st -match 'published=\\\\\.\\pipe\\story-firewall-[0-9a-f]{32}') "pipe name published"
          Check ($st -match 'owner_trusted=true') "data dir owner trusted"
          $run = (Get-ItemProperty $runKey -Name StoryFirewall -ErrorAction SilentlyContinue).StoryFirewall
          Check ($run -match 'story-firewall-ui\.exe" --tray') "HKLM Run --tray ($run)"
          $acl = (Get-Acl $dir).Access | Where-Object { $_.IdentityReference -match 'Users|Authenticated' -and $_.FileSystemRights -match 'Write|Modify|FullControl' -and $_.AccessControlType -eq 'Allow' }
          Check ($null -eq $acl) "users cannot write install dir"
          $start = (Get-CimInstance Win32_Service -Filter "Name='StoryFirewall'")
          Check ($start.StartMode -eq "Auto") "start mode auto ($($start.StartMode))"
          Check ($start.PathName -like "*Program Files\Story Firewall\story-firewall-svc.exe*") "service path in Program Files ($($start.PathName))"

          # 1b. 22nd review: apply one real policy (signed admin client) so the upgrade runs with WFP filters present
          $keep = Join-Path $env:RUNNER_TEMP "svc-copy.exe"
          Copy-Item $svcExe $keep
          & $svcExe install --test-signer "StoryFirewall Test" 2>&1 | ForEach-Object { Log $_ }
          & $svcExe stop 2>&1 | ForEach-Object { Log $_ }
          & $svcExe start 2>&1 | ForEach-Object { Log $_ }
          Start-Sleep -Seconds 4
          $ap = & .\target\release\svc-poc.exe client-apply 2>&1 | Out-String
          Log $ap
          Check ($ap -match 'confirm=ok') "policy applied and confirmed before upgrade"
          $n0 = 0; if ((& $keep status | Out-String) -match 'wfp_filters=(\d+)') { $n0 = [int]$Matches[1] }
          Check ($n0 -ge 1) "WFP filters present before upgrade ($n0)"

          # 2. reinstall over it (upgrade path), sampling our filter count the whole time
          $pidBefore = $start.ProcessId
          $flag = Join-Path $env:RUNNER_TEMP "upgrade-done.txt"
          $sampler = Start-Job -ArgumentList $keep, $flag {
            param($keep, $flag)
            $min = 999999; $n = 0
            while (-not (Test-Path $flag)) {
              $o = & $keep status | Out-String
              if ($o -match 'wfp_filters=(\d+)') { $v = [int]$Matches[1]; $n++; if ($v -lt $min) { $min = $v } }
              Start-Sleep -Milliseconds 200
            }
            "samples=$n min=$min"
          }
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          Log "reinstall exit=$($p.ExitCode)"
          Start-Sleep -Seconds 3
          Set-Content $flag "x"
          $samp = (Receive-Job $sampler -Wait -AutoRemoveJob | Out-String).Trim()
          Log "during upgrade: $samp"
          $smin = -1; if ($samp -match 'min=(\d+)') { $smin = [int]$Matches[1] }
          Check (($samp -match 'samples=[1-9]') -and $smin -ge $n0) "filters never dropped during upgrade (min=$smin, before=$n0)"
          for ($i = 0; $i -lt 20 -and (SvcState) -ne "Running"; $i++) { Start-Sleep -Seconds 1 }
          Check ((SvcState) -eq "Running") "service running after reinstall"
          $after = Get-CimInstance Win32_Service -Filter "Name='StoryFirewall'"
          Log "service pid before=$pidBefore after=$($after.ProcessId) (restarted = files replaced)"
          $st2 = & $svcExe status 2>&1 | Out-String
          Log $st2
          Check ($st2 -match "wfp_filters=$n0\b") "same filter count after upgrade + restart reconcile"

          # 3. uninstall (silent = keep data)
          $un = Join-Path $dir "uninstall.exe"
          $p = Start-Process -FilePath $un -ArgumentList "/S" -Wait -PassThru
          Log "uninstall exit=$($p.ExitCode)"
          for ($i = 0; $i -lt 60 -and ((Get-Service StoryFirewall -ErrorAction SilentlyContinue) -or (Test-Path $svcExe)); $i++) { Start-Sleep -Seconds 1 }
          Check (-not (Get-Service StoryFirewall -ErrorAction SilentlyContinue)) "service removed"
          Check (-not (Test-Path $svcExe)) "files removed"
          Check (-not (Get-ItemProperty $runKey -Name StoryFirewall -ErrorAction SilentlyContinue)) "Run value removed"
          $st3 = & $keep status 2>&1 | Out-String
          Log $st3
          Check ($st3 -match 'published=-') "pipe name unpublished"
          Check ($st3 -match 'wfp_filters=0') "no WFP filters left"
          Check (Test-Path (Join-Path $env:ProgramData "StoryFirewall")) "data kept on silent uninstall"
          Log "assert: $bad failed"
          if ($bad -gt 0) { exit 1 }
        displayName: Install, reinstall, uninstall (silent) and assert
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item build-svc.log, test-ui.log, build-installer.log, installer-test.txt $run -ErrorAction SilentlyContinue
          pwsh -NoProfile -File .azure/push-log.ps1 -Name a28 -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
  - job: devhost
    displayName: devhost (devhost-windows.yml)
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['p.devhost'], 'true'))
    timeoutInMinutes: 30
    pool:
      vmImage: windows-2022
    variables:
      CARGO_TERM_COLOR: never
      RUNNER_TEMP: $(Agent.TempDirectory)
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 1
        path: s/story-firewall
      - powershell: |
          New-Item -ItemType Directory -Force C:\fw | Out-Null
          Copy-Item -Recurse story-firewall C:\fw\story-firewall
          powershell -ExecutionPolicy Bypass -File C:\fw\story-firewall\poc\devhost\install-job-runner.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = Get-ScheduledTask -TaskName StoryFirewallDevJobs
          "task principal: $($t.Principal.UserId) $($t.Principal.LogonType) $($t.Principal.RunLevel)"
          Disable-ScheduledTask -TaskName StoryFirewallDevJobs | Out-Null
          # Sysmon for b2 (outside the runner, once)
          powershell -ExecutionPolicy Bypass -File C:\fw\story-firewall\poc\b2\b2-run.ps1 -InstallSysmon -Seconds 60 -NoScenario | Out-Null

          # ---- traps a medium-integrity user process could plant ----
          $mark = "C:\fw\trap"
          New-Item -ItemType Directory -Force $mark | Out-Null
          $gitTrap = "[core]`n`tfsmonitor = cmd /c echo pwned > C:\\fw\\trap\\git.txt`n[url `"https://example.invalid/`"]`n`tinsteadOf = https://github.com/`n"
          Add-Content -Path (Join-Path $env:USERPROFILE ".gitconfig") -Value $gitTrap
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE ".cargo") | Out-Null
          Set-Content -Path (Join-Path $env:USERPROFILE ".cargo\config.toml") -Value "[build]`nrustc-wrapper = 'C:\\fw\\trap\\wrap.cmd'`n"
          Set-Content -Path "$mark\wrap.cmd" -Value "@echo pwned > C:\fw\trap\cargo.txt`r`n@%*"
          New-Item -Path "HKCU:\Software\Microsoft\Command Processor" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Command Processor" -Name AutoRun -Value "echo pwned > C:\fw\trap\cmd.txt"

          $inbox = Join-Path $env:ProgramFiles "StoryFirewallDev\requests"
          '{"job":"status"}' | Set-Content $inbox\t1.json -Encoding UTF8
          '{"job":"evil","cmd":"calc"}' | Set-Content $inbox\t2.json -Encoding UTF8
          '{"job":"b2","seconds":5}' | Set-Content $inbox\t3.json -Encoding UTF8
          # 23rd review S2: a job name carrying a fake log line must not reach the log
          '{"job":"x\r\n2026-01-01 00:00:00Z done exit=0"}' | Set-Content $inbox\t5.json -Encoding UTF8
          '{"job":"uninstall"}' | Set-Content $inbox\t6.json -Encoding UTF8
          '{"job":"b2","seconds":60}' | Set-Content $inbox\t4.json -Encoding UTF8
          $base = Join-Path $env:ProgramFiles "StoryFirewallDev"
          # run the real task as SYSTEM, wait until the b2 request finished
          Enable-ScheduledTask -TaskName StoryFirewallDevJobs | Out-Null
          Start-ScheduledTask -TaskName StoryFirewallDevJobs
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 15
            $t4 = Join-Path $base "logs\jobs\t4.txt"
            if ((Test-Path $t4) -and ((Get-Content $t4 -Raw) -match "done exit=")) { break }
          }
          Disable-ScheduledTask -TaskName StoryFirewallDevJobs | Out-Null
          $bad = 0
          function Check($ok, $m) { if ($ok) { "PASS  $m" } else { "FAIL  $m"; $script:bad++ } }
          $j = Join-Path $base "logs\jobs"
          Get-ChildItem $j | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName }
          Check ((Get-Content (Join-Path $j "t1.txt") -Raw) -match "ok free_gb=.* admin_toolchain=True") "status job, admin toolchain"
          Check ((Get-Content (Join-Path $j "t2.txt") -Raw) -match "rejected: unknown job") "unknown job rejected"
          Check ((Get-Content (Join-Path $j "t3.txt") -Raw) -match "rejected: seconds") "bad seconds rejected"
          Check ((Get-Content (Join-Path $j "t6.txt") -Raw) -match "not installed") "uninstall job when nothing installed"
          $t5 = Get-Content (Join-Path $j "t5.txt") -Raw
          Check (($t5 -match "rejected: bad job name") -and ($t5 -notmatch "done exit")) "forged job name not logged"
          Check ((Get-Content (Join-Path $j "t4.txt") -Raw) -match "fetch exit=0 repo at [0-9a-f]+") "repo fetched from real origin (insteadOf ignored)"
          Check ((Get-Content (Join-Path $j "t4.txt") -Raw) -match "done exit=0 out=") "b2 job ran"
          $last = Get-ChildItem (Join-Path $base "logs\b2-*") -Directory | Sort-Object Name | Select-Object -Last 1
          Check ($last -and (Test-Path (Join-Path $last.FullName "report-2s.txt"))) "b2 report in admin log folder"
          Check (-not (Get-ChildItem $inbox -Filter *.json)) "requests consumed"
          Check (-not (Test-Path "$mark\git.txt")) "user ~/.gitconfig fsmonitor not executed"
          Check (-not (Test-Path "$mark\cargo.txt")) "user ~/.cargo rustc-wrapper not executed"
          Check (-not (Test-Path "$mark\cmd.txt")) "HKCU cmd AutoRun not executed"
          $acl = (Get-Acl $base).Access | Where-Object { $_.IdentityReference -match 'Users' -and $_.FileSystemRights -match 'Write|Modify|FullControl' }
          Check ($null -eq $acl) "users cannot write runner folder"
          $cfg = (Get-Acl (Join-Path $base "story-firewall\.git\config")).Access | Where-Object { $_.IdentityReference -match 'Users' }
          Check ($null -eq $cfg) "users cannot read clone .git\config (token)"
          $t = Get-ScheduledTask -TaskName StoryFirewallDevJobs
          Check ($t.Principal.UserId -match 'SYSTEM|S-1-5-18') "task runs as SYSTEM ($($t.Principal.UserId))"
          $ia = (Get-Acl $inbox).Access | Where-Object { $_.IdentityReference -match 'Users' }
          Check (($ia | Where-Object { $_.FileSystemRights -match 'Delete|FullControl|Modify' }) -eq $null) "users cannot delete/rename the inbox ($(($ia | ForEach-Object { $_.FileSystemRights }) -join ','))"
          Check (($ia | Where-Object { $_.FileSystemRights -match 'CreateFiles|WriteData' }) -ne $null) "users can add request files"
          if ($last) { Get-Content (Join-Path $last.FullName "report-2s.txt") -Encoding UTF8 | Select-Object -First 10 }
          "assert: $bad failed"
          if ($bad -gt 0) { exit 1 }
        displayName: Install runner, plant user-level traps, drop requests, run once, assert
        workingDirectory: $(Agent.BuildDirectory)/s
        env:
          SF_GIT_TOKEN: $(GH_PUSH_TOKEN)
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
      - powershell: |
          Remove-Item (Join-Path $env:USERPROFILE ".gitconfig") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:USERPROFILE ".cargo\config.toml") -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Command Processor" -Name AutoRun -ErrorAction SilentlyContinue
          "traps removed"
        displayName: Remove traps (they would also hit the runner's own git/cmd in post steps)
        condition: always()
        workingDirectory: $(Agent.BuildDirectory)/s
      - pwsh: |
          $run = Join-Path $env:AGENT_TEMPDIRECTORY "poclogs"
          New-Item -ItemType Directory -Force $run | Out-Null
          if (Test-Path 'C:\Program Files\StoryFirewallDev\logs') { Copy-Item 'C:\Program Files\StoryFirewallDev\logs\*' $run -Recurse -ErrorAction SilentlyContinue }
          pwsh -NoProfile -File story-firewall/.azure/push-log.ps1 -Name devhost -Dir $run
        displayName: Publish logs to ci-logs branch
        condition: always()
        workingDirectory: $(Agent.BuildDirectory)/s
        env:
          GH_PUSH_TOKEN: $(GH_PUSH_TOKEN)
